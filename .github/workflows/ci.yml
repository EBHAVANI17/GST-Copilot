name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Fast checks on every pull request and push.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest -q

  # 2. Real Postgres + Redis: run migrations and hit /ready against them.
  integration:
    runs-on: ubuntu-latest
    needs: checks
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gst
          POSTGRES_PASSWORD: gst
          POSTGRES_DB: gst_copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gst -d gst_copilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+asyncpg://gst:gst@localhost:5432/gst_copilot
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Start API and check readiness
        run: |
          uvicorn gst_copilot.api.main:app --port 8000 &
          for i in $(seq 1 20); do curl -sf localhost:8000/ready && exit 0; sleep 1; done
          echo "API never became ready" && exit 1

  # 3. On main only: build the Docker image and publish it to GitHub Container Registry.
  publish:
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t $IMAGE:${GITHUB_SHA::7} -t $IMAGE:latest .
          docker push $IMAGE:${GITHUB_SHA::7}
          docker push $IMAGE:latest
