# Local development stack: the same containers that run in production.
#   docker compose up --build        start everything
#   docker compose logs -f api       follow the API logs
#   docker compose down              stop (add -v to also delete the database)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gst
      POSTGRES_PASSWORD: gst
      POSTGRES_DB: gst_copilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gst -d gst_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs database migrations once, then exits. The API waits for it to succeed.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gst:gst@db:5432/gst_copilot
    depends_on:
      db: {condition: service_healthy}

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gst:gst@db:5432/gst_copilot
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    build: .
    command: ["arq", "gst_copilot.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gst:gst@db:5432/gst_copilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
